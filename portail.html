<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GeoFresh — Portail</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=2.4.9"></script>
<script src="js/commun.js?v=2.4.9"></script>
<script>const _supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
<link rel="stylesheet" href="css/geofresh.css?v=2.4.9"/>
<link rel="stylesheet" href="css/portail.css?v=2.4.9"/>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img class="logo-img" src="img/logo-geofresh.png" alt="GeoFresh" style="height:76px;width:auto;display:block;margin:0 auto;"/>
      <div class="login-tagline">Supervision géothermique</div>
    </div>
    <label class="login-label">Email</label>
    <input id="l-email" class="login-input" type="email" placeholder="votre@email.fr" autocomplete="email"/>
    <label class="login-label">Mot de passe</label>
    <input id="l-pwd" class="login-input" type="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" id="l-btn" onclick="doLogin()">Connexion</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────── -->
<div id="app" style="display:none;">

  <!-- Header -->
  <header class="hdr">
    <div class="logo">
      <div>
        <img class="logo-img" src="img/logo-geofresh.png" alt="GeoFresh" style="height:40px;width:auto;display:block;"/>
        <div class="logo-badge">Portail de supervision</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="user-chip">
        <div>
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Déconnexion</button>
    </div>
  </header>

  <main class="main">

    <!-- Titre -->
    <div class="page-title">Mes exploitations</div>
    <div class="page-sub" id="page-sub">Chargement...</div>

    <!-- Stats globales (super admin) -->
    <div class="stats-row" id="stats-row" style="display:none;">
      <div class="stat-card">
        <div class="stat-val" id="st-total">—</div>
        <div class="stat-lbl">Exploitations</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="st-clients">—</div>
        <div class="stat-lbl">Clients</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <span style="color:var(--gf-muted);">🔍</span>
          <input id="search-input" type="text" placeholder="Rechercher une exploitation..."
            oninput="filterList()"/>
        </div>
      </div>
      <button class="btn-add" id="btn-add" style="display:none;" onclick="openModal()">
        + Nouvelle exploitation
      </button>
    </div>

    <!-- Liste -->
    <div class="exploit-list" id="exploit-list">
      <div class="empty-state">
        <div class="empty-state-icon">🌾</div>
        <div class="empty-state-text">Chargement des exploitations...</div>
      </div>
    </div>

    <!-- Saisons terminées (tous les comptes, dont clients) -->
    <div class="summary-section" id="saisons-section">
      <div class="section-title">📅 Saisons terminées</div>
      <div class="summary-grid" id="saisons-grid">
        <div class="empty-state-text" style="color:var(--gf-muted);">Chargement…</div>
      </div>
    </div>

    <!-- Résumé global (super admin) -->
    <div class="summary-section" id="summary-section" style="display:none;">
      <div class="section-title">📊 Résumé global</div>
      <div class="summary-grid" id="summary-grid"></div>
    </div>

  </main>
</div>

<!-- ── MODALE AJOUT EXPLOITATION ────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Nouvelle exploitation</div>
    <div class="form-group">
      <label class="form-label">Nom de l'exploitation *</label>
      <input id="f-nom" class="form-input" type="text" placeholder="Ex: GAEC Dupont — Fruges"/>
    </div>
    <div class="form-group">
      <label class="form-label">Adresse</label>
      <input id="f-adresse" class="form-input" type="text" placeholder="Ville, département"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Capacité stockage (t)</label>
        <input id="f-capa" class="form-input" type="number" placeholder="500" min="0"/>
      </div>
      <div class="form-group">
        <label class="form-label">Nb PAC</label>
        <input id="f-pac" class="form-input" type="number" placeholder="3" min="1" max="10"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Bâtiments à chauffer</label>
      <div class="brique-checks" id="brique-checks">
        <label class="brique-check checked" onclick="toggleBrique(this,'stockage_pdt')">
          <input type="checkbox" value="stockage_pdt" checked/> 🥔 Stockage PDT
        </label>
        <label class="brique-check" onclick="toggleBrique(this,'habitation')">
          <input type="checkbox" value="habitation"/> 🏠 Habitation
        </label>
        <label class="brique-check" onclick="toggleBrique(this,'serre')">
          <input type="checkbox" value="serre"/> 🌿 Serre
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-submit" onclick="createExploitation()">Créer</button>
    </div>
  </div>
</div>

<script>
// ── AUTH ──────────────────────────────────────────────────────
let AUTH_TOKEN = null;
let USER_ROLE  = null;
let USER_ID    = null;
let ALL_EXPLOITS = [];

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('l-err');
  btn.textContent = 'Connexion...'; btn.disabled = true; err.style.display = 'none';

  const {data, error} = await _supa.auth.signInWithPassword({email, password: pwd});
  if(error) {
    err.textContent = error.message.includes('Invalid') ? 'Email ou mot de passe incorrect' : error.message;
    err.style.display = 'block'; btn.textContent = 'Connexion'; btn.disabled = false; return;
  }
  await initApp(data.session);
}

async function doLogout() {
  await _supa.auth.signOut();
  AUTH_TOKEN = null; USER_ROLE = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  const {data} = await _supa.auth.getSession();
  if(data?.session) await initApp(data.session);
}

async function initApp(session) {
  AUTH_TOKEN = session.access_token;
  USER_ID    = session.user.id;

  // Charger le profil
  const {data: profile} = await _supa
    .from('profiles')
    .select('role, nom, email')
    .eq('id', USER_ID)
    .single();

  USER_ROLE = profile?.role || 'client';
  document.getElementById('user-name').textContent = profile?.nom || session.user.email.split('@')[0];
  document.getElementById('user-role').textContent = GEOFRESH_CONFIG.roles[USER_ROLE] || 'Client';
  document.body.dataset.role = USER_ROLE;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if(gfIsStaff(USER_ROLE)) {
    document.querySelector('.page-title').textContent = 'Exploitations';
  }
  if(USER_ROLE === 'super_admin') {
    document.getElementById('btn-add').style.display = 'flex';
    document.getElementById('stats-row').style.display = 'grid';
    document.getElementById('summary-section').style.display = 'block';
  }

  await loadExploitations();
  loadSaisons();
}

// ── SAISONS TERMINÉES ─────────────────────────────────────────
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '—';
const fmtNum  = (v, u, n = 1) => v === null || v === undefined ? '—' : `${parseFloat(v).toFixed(n)}${u}`;

async function loadSaisons() {
  const grid = document.getElementById('saisons-grid');
  const {data, error} = await _supa.rpc('saisons_terminees');
  if(error) { grid.innerHTML = `<div class="empty-state-text" style="color:var(--gf-err);">${error.message}</div>`; return; }
  if(!data.length) { grid.innerHTML = '<div class="empty-state-text" style="color:var(--gf-muted);">Aucune saison terminée pour le moment.</div>'; return; }
  const multi = new Set(data.map(s => s.exploitation_id)).size > 1;
  grid.innerHTML = data.map(s => `
    <div class="summary-card">
      <div class="summary-card-title">${s.nom}${multi ? ' · ' + s.exploitation : ''}</div>
      <div class="summary-row"><span class="summary-key">Période</span><span class="summary-val" style="font-size:11px;">${fmtDate(s.date_debut)} → ${fmtDate(s.date_fin)}</span></div>
      <div class="summary-row"><span class="summary-key">T stock moy.</span><span class="summary-val">${fmtNum(s.t_stock_moy, ' °C')}</span></div>
      <div class="summary-row"><span class="summary-key">T stock min / max</span><span class="summary-val">${fmtNum(s.t_stock_min, '')} / ${fmtNum(s.t_stock_max, ' °C')}</span></div>
      <div class="summary-row"><span class="summary-key">HR moy.</span><span class="summary-val">${fmtNum(s.hr_moy, ' %', 0)}</span></div>
      <div class="summary-row"><span class="summary-key">CO₂ max</span><span class="summary-val">${fmtNum(s.co2_max, ' ppm', 0)}</span></div>
      <div class="summary-row"><span class="summary-key">T ext moy.</span><span class="summary-val">${fmtNum(s.t_ext_moy, ' °C')}</span></div>
      <div class="summary-row"><span class="summary-key">PAC en marche</span><span class="summary-val">${fmtNum(s.pac_pct, ' % du temps', 0)}</span></div>
      <div class="summary-row"><span class="summary-key">Alertes</span><span class="summary-val" style="${s.nb_alertes > 0 ? 'color:var(--gf-err)' : ''}">${s.nb_alertes}</span></div>
      <div class="summary-row"><span class="summary-key">Mesures</span><span class="summary-val">${Number(s.nb_mesures).toLocaleString('fr-FR')}</span></div>
    </div>`).join('');
}

// ── EXPLOITATIONS ─────────────────────────────────────────────
async function loadExploitations() {
  const hdrs = {apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + AUTH_TOKEN};

  // Charger exploitations + briques
  const {data: exploits} = await _supa
    .from('exploitations')
    .select('*, briques(type, nom, actif, ordre), exploitation_users(role)')
    .order('nom');

  if(!exploits) return;
  ALL_EXPLOITS = exploits;

  // Charger dernières données pour chaque exploitation
  await enrichWithMetrics(exploits, hdrs);

  renderList(exploits);
  if(USER_ROLE === 'super_admin') renderStats(exploits);
}

async function enrichWithMetrics(exploits, hdrs) {
  // Pour chaque exploitation, récupérer la dernière T stock et les alarmes
  await Promise.all(exploits.map(async (e) => {
    try {
      const [stoR, almR] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/stockage_readings?exploitation_id=eq.${e.id}&order=ts.desc&limit=1&select=t_stock,mode_actif,pac_on`, {headers: hdrs}),
        fetch(`${SUPABASE_URL}/rest/v1/alarmes_log?exploitation_id=eq.${e.id}&acquittee=eq.false&select=id`, {headers: hdrs})
      ]);
      const sto = stoR.ok ? await stoR.json() : [];
      const alm = almR.ok ? await almR.json() : [];
      e._t_stock    = sto?.[0]?.t_stock ?? null;
      e._mode       = sto?.[0]?.mode_actif ?? null;
      e._pac_on     = sto?.[0]?.pac_on ?? false;
      e._nb_alertes = Array.isArray(alm) ? alm.length : 0;
    } catch(_) {
      e._t_stock = null; e._nb_alertes = 0;
    }
  }));
}

function renderList(exploits) {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = exploits.filter(e =>
    e.nom.toLowerCase().includes(q) || (e.adresse||'').toLowerCase().includes(q)
  );

  document.getElementById('page-sub').textContent =
    `${filtered.length} exploitation${filtered.length > 1 ? 's' : ''}`;

  if(filtered.length === 0) {
    document.getElementById('exploit-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🌾</div>
        <div class="empty-state-text">Aucune exploitation trouvée</div>
      </div>`;
    return;
  }

  document.getElementById('exploit-list').innerHTML = filtered.map(e => {
    const hasAlerte = e._nb_alertes > 0;
    const t = e._t_stock !== null ? parseFloat(e._t_stock) : null;
    const tClass = t === null ? '' : t > 8 ? 'err' : t < 2 ? 'err' : t > 6 ? 'warn' : 'ok';
    const tStr = t !== null ? t.toFixed(1) + '°C' : '--';

    const briques = (e.briques || [])
      .sort((a,b) => a.ordre - b.ordre)
      .map(b => `<span class="brique-tag ${b.actif ? b.type : 'off'}" title="${b.nom || ''}">${gfBriqueLabel(b.type)}</span>`)
      .join('');

    const alerteBadge = hasAlerte
      ? `<div class="alerte-badge">⚠ ${e._nb_alertes} alerte${e._nb_alertes > 1 ? 's' : ''}</div>` : '';

    return `
    <div class="exploit-card ${hasAlerte ? 'alerte' : ''} ${e.statut !== 'actif' ? 'inactif' : ''}"
      onclick="openExploitation('${e.id}')" title="${gfIsStaff(USER_ROLE) ? 'Ouvrir la vue opérateur' : 'Ouvrir le tableau de bord'}">
      <div class="exploit-icon">${e.statut === 'actif' ? '🌾' : '⏸'}</div>
      <div class="exploit-info">
        <div class="exploit-nom">${e.nom}</div>
        <div class="exploit-adresse">${e.adresse || '—'} · ${e.capacite_pdt || 0}t · ${e.nb_pac || 0} PAC</div>
        <div class="exploit-briques">${briques}</div>
      </div>
      <div class="exploit-metrics">
        <div class="metric-item">
          <div class="metric-val ${tClass}">${tStr}</div>
          <div class="metric-lbl">T Stock</div>
        </div>
        <div class="metric-item">
          <div class="metric-val ${e._pac_on ? 'ok' : ''}">${e._pac_on ? 'ON' : 'OFF'}</div>
          <div class="metric-lbl">PAC</div>
        </div>
        <div class="metric-item">
          <div class="metric-val" style="font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e._mode || '—'}</div>
          <div class="metric-lbl">Mode</div>
        </div>
      </div>
      <div class="exploit-right">
        ${e.statut !== 'actif' ? `<span class="statut-badge inactif">En pause</span>` : ''}
        ${alerteBadge}
        ${gfIsStaff(USER_ROLE)
          ? `<a class="view-link" href="index.html?exploitation_id=${e.id}" onclick="event.stopPropagation()">👁 Vue client</a>`
          : ''}
        <span class="arrow-btn">→</span>
      </div>
    </div>`;
  }).join('');
}

function filterList() { renderList(ALL_EXPLOITS); }

// Super admin / opérateur → pilotage ; client → vue client (lecture seule)
function openExploitation(id) {
  const page = gfIsStaff(USER_ROLE) ? 'operateur.html' : 'index.html';
  window.location.href = `${page}?exploitation_id=${id}`;
}

// ── STATS GLOBALES ────────────────────────────────────────────
async function renderStats(exploits) {
  document.getElementById('st-total').textContent   = exploits.length;

  // Compter les clients uniques
  const {data: users} = await _supa.from('exploitation_users').select('user_id').neq('role','super_admin');
  const uniq = new Set((users||[]).map(u => u.user_id));
  document.getElementById('st-clients').textContent = uniq.size;

  // Résumé par exploitation
  document.getElementById('summary-grid').innerHTML = exploits.slice(0,6).map(e => `
    <div class="summary-card">
      <div class="summary-card-title">${e.nom}</div>
      <div class="summary-row"><span class="summary-key">T Stock</span><span class="summary-val">${e._t_stock ? parseFloat(e._t_stock).toFixed(1)+'°C' : '--'}</span></div>
      <div class="summary-row"><span class="summary-key">PAC</span><span class="summary-val">${e._pac_on ? '🟢 ON' : '⚪ OFF'}</span></div>
      <div class="summary-row"><span class="summary-key">Mode</span><span class="summary-val" style="font-size:11px;">${e._mode || '--'}</span></div>
      <div class="summary-row"><span class="summary-key">Alertes</span><span class="summary-val" style="${e._nb_alertes>0?'color:var(--gf-err)':''}"> ${e._nb_alertes || 0}</span></div>
    </div>`).join('');
}

// ── MODALE AJOUT ──────────────────────────────────────────────
function openModal()  { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

function toggleBrique(el, type) {
  el.classList.toggle('checked');
  el.querySelector('input').checked = el.classList.contains('checked');
}

async function createExploitation() {
  const nom    = document.getElementById('f-nom').value.trim();
  if(!nom) { alert('Le nom est obligatoire'); return; }
  const adresse = document.getElementById('f-adresse').value.trim();
  const capa   = parseInt(document.getElementById('f-capa').value) || 0;
  const nbPac  = parseInt(document.getElementById('f-pac').value) || 3;
  const briques = [...document.querySelectorAll('#brique-checks input:checked')].map(i => i.value);

  // Créer l'exploitation
  const {data: exploit, error} = await _supa
    .from('exploitations')
    .insert({nom, adresse, capacite_pdt: capa, nb_pac: nbPac})
    .select()
    .single();

  if(error) { alert('Erreur : ' + error.message); return; }

  // Créer les briques
  await _supa.from('briques').insert(
    briques.map((type, i) => ({
      exploitation_id: exploit.id,
      type,
      nom: type === 'stockage_pdt' ? `Stockage PDT ${capa}t` :
           type === 'habitation'   ? 'Maison agricole' :
           'Serre',
      actif: true,
      ordre: i + 1
    }))
  );

  // Lier au super admin
  await _supa.from('exploitation_users').insert({
    exploitation_id: exploit.id,
    user_id: USER_ID,
    role: 'super_admin'
  });

  closeModal();
  await loadExploitations();
  loadSaisons();
}


// ── INIT ─────────────────────────────────────────────────────
checkSession();
</script>
</body>
</html>
